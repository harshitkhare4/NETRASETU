services:
  - type: web
    name: netrasetu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: NETRASETU_RESEARCH_MODE
        value: "false"
      - key: NETRASETU_MODEL_PATH
        value: models/NetraSetu_ResNet50_best.pth